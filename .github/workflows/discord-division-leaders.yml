name: Discord Division Leaders

on:
  schedule:
    - cron: "10 14 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the live division leaders without posting or committing."
        required: false
        type: boolean
        default: true
      force_refresh:
        description: "Rewrite the persistent Discord card even when the leaders are unchanged."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: discord-division-leaders
  cancel-in-progress: false

jobs:
  division-leaders:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DISCORD_DIVISION_LEADERS_ENABLED == 'true' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update the persistent division-leaders card
        shell: pwsh
        env:
          DISCORD_WEBHOOK_DIVISION_LEADERS: ${{ secrets.DISCORD_WEBHOOK_DIVISION_LEADERS }}
        run: |
          $args = @(
            "-NoProfile", "-ExecutionPolicy", "Bypass",
            "-File", ".\scripts\post-discord-division-leaders.ps1"
          )
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.dry_run }}" -eq "true") {
            $args += "-DryRun"
          }
          if ("${{ inputs.force_refresh }}" -eq "true") {
            $args += "-ForceRefresh"
          }
          powershell @args

      - name: Save the Discord message state
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) }}
        shell: pwsh
        run: |
          $statePath = "data/discord-division-leaders-state.json"
          if (Test-Path -LiteralPath $statePath) {
            git add -- $statePath
          }
          if (git diff --cached --quiet) {
            Write-Host "Discord division-leaders state is already current."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Discord division leaders"

          $pushed = $false
          foreach ($attempt in 1..4) {
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { throw "Could not rebase the division-leaders update onto origin/main." }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              $pushed = $true
              break
            }
            if ($attempt -lt 4) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not $pushed) { throw "Could not push the division-leaders state after four attempts." }

name: Discord Draft Round Updates

on:
  schedule:
    # Lightweight watchdog. The active updater chain supplies the five-minute checks.
    - cron: "7/15 * * * *"
  workflow_dispatch:
    inputs:
      league_record_ids:
        description: "Optional comma-separated bracket league IDs. Leave blank for the five configured Redraft Bracket divisions."
        required: false
        default: ""
      include_completed_drafts:
        description: "Backfill completed drafts that are not already tracked. Use carefully because this can post many rounds."
        required: false
        type: boolean
        default: false
      initialize_threads:
        description: "Create missing division thread starters before the first pick is made."
        required: false
        type: boolean
        default: false
      force_refresh:
        description: "Refresh existing team cards even when no new round has completed."
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Fetch Sleeper data and preview completed rounds without posting to Discord."
        required: false
        type: boolean
        default: true
      continue_chain:
        description: "Keep checking automatically every five minutes until all configured drafts are complete."
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

jobs:
  watchdog:
    if: ${{ github.event_name == 'schedule' && vars.DISCORD_DRAFT_ROUND_UPDATES_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completion state
        uses: actions/checkout@v4

      - name: Restart a missing updater chain
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $statePath = "data/discord-draft-pulse-state.json"
          if (Test-Path -LiteralPath $statePath) {
            $completionState = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
            if ($completionState.PSObject.Properties["allDraftsComplete"] -and [bool]$completionState.allDraftsComplete) {
              Write-Host "All configured drafts are complete. The updater chain will remain stopped."
              exit 0
            }
          }

          $workflow = "discord-draft-round-updates.yml"
          $runs = gh run list `
            --repo "${{ github.repository }}" `
            --workflow $workflow `
            --event workflow_dispatch `
            --limit 10 `
            --json status,conclusion,createdAt,updatedAt,databaseId,url | ConvertFrom-Json

          $cutoff = (Get-Date).ToUniversalTime().AddMinutes(-12)
          $healthyRuns = @($runs | Where-Object {
            $_.status -in @("queued", "pending", "in_progress") -or
            ($_.conclusion -eq "success" -and ([datetime]$_.updatedAt).ToUniversalTime() -ge $cutoff)
          })

          if ($healthyRuns.Count -gt 0) {
            Write-Host "A healthy draft updater chain is active or completed within the last 12 minutes."
            exit 0
          }

          Write-Host "No healthy draft updater chain was found. Starting a replacement."
          $dispatched = $false
          foreach ($attempt in 1..5) {
            gh workflow run $workflow `
              --repo "${{ github.repository }}" `
              --ref main `
              -f dry_run=false `
              -f continue_chain=true
            if ($LASTEXITCODE -eq 0) {
              $dispatched = $true
              break
            }
            if ($attempt -lt 5) {
              $delay = 15 * $attempt
              Write-Warning "Dispatch attempt $attempt failed. Retrying in $delay seconds."
              Start-Sleep -Seconds $delay
            }
          }

          if (-not $dispatched) {
            throw "The watchdog could not restart the draft updater chain after five attempts."
          }

  update:
    if: ${{ github.event_name == 'workflow_dispatch' && (vars.DISCORD_DRAFT_ROUND_UPDATES_ENABLED == 'true' || inputs.continue_chain != true) }}
    runs-on: windows-latest
    concurrency:
      group: discord-draft-round-updates
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post completed draft rounds
        shell: pwsh
        env:
          DISCORD_WEBHOOK_DRAFT_APEX: ${{ secrets.DISCORD_WEBHOOK_DRAFT_APEX }}
          DISCORD_WEBHOOK_DRAFT_DOMINION: ${{ secrets.DISCORD_WEBHOOK_DRAFT_DOMINION }}
          DISCORD_WEBHOOK_DRAFT_IRON: ${{ secrets.DISCORD_WEBHOOK_DRAFT_IRON }}
          DISCORD_WEBHOOK_DRAFT_TITAN: ${{ secrets.DISCORD_WEBHOOK_DRAFT_TITAN }}
          DISCORD_WEBHOOK_DRAFT_VANGUARD: ${{ secrets.DISCORD_WEBHOOK_DRAFT_VANGUARD }}
        run: |
          $args = @(
            "-ExecutionPolicy", "Bypass",
            "-File", ".\scripts\post-discord-draft-rounds.ps1",
            "-ConfigPath", "data/discord-draft-round-config.json",
            "-StatePath", "data/discord-draft-round-state.json"
          )

          $leagueIds = "${{ inputs.league_record_ids }}".Trim()
          if (-not [string]::IsNullOrWhiteSpace($leagueIds)) {
            $args += "-LeagueRecordIds"
            $args += $leagueIds
          }

          if ("${{ inputs.include_completed_drafts }}" -eq "true") {
            $args += "-IncludeCompletedDrafts"
          }

          if ("${{ inputs.initialize_threads }}" -eq "true") {
            $args += "-InitializeThreads"
          }

          if ("${{ inputs.force_refresh }}" -eq "true") {
            $args += "-ForceRefresh"
          }

          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.dry_run }}" -eq "true") {
            $args += "-DryRun"
          }

          powershell @args

      - name: Post cross-division Draft Pulse
        id: draft_pulse
        shell: pwsh
        env:
          DISCORD_WEBHOOK_DRAFT_PULSE: ${{ secrets.DISCORD_WEBHOOK_DRAFT_PULSE }}
        run: |
          $args = @(
            "-ExecutionPolicy", "Bypass",
            "-File", ".\scripts\post-discord-draft-pulse.ps1",
            "-ConfigPath", "data/discord-draft-pulse-config.json",
            "-StatePath", "data/discord-draft-pulse-state.json"
          )

          if ("${{ inputs.force_refresh }}" -eq "true") {
            $args += "-ForceRefresh"
          }

          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.dry_run }}" -eq "true") {
            $args += "-DryRun"
          }

          powershell @args

      - name: Save draft tracker state
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        shell: pwsh
        run: |
          $stateFiles = @(
            "data/discord-draft-round-state.json",
            "data/discord-draft-pulse-state.json"
          )

          if (git diff --quiet -- $stateFiles) {
            Write-Host "Discord draft tracker and Draft Pulse state are already current."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $stateFiles
          git commit -m "Update Discord draft automation state"
          git pull --rebase origin main
          git push

      - name: Queue next draft check
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.continue_chain == true && vars.DISCORD_DRAFT_ROUND_UPDATES_ENABLED == 'true' && steps.draft_pulse.outputs.all_drafts_complete != 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Host "Waiting five minutes before queuing the next draft check."
          Start-Sleep -Seconds 300
          $dispatched = $false
          foreach ($attempt in 1..5) {
            gh workflow run discord-draft-round-updates.yml `
              --repo "${{ github.repository }}" `
              --ref main `
              -f dry_run=false `
              -f continue_chain=true
            if ($LASTEXITCODE -eq 0) {
              $dispatched = $true
              break
            }
            if ($attempt -lt 5) {
              $delay = 15 * $attempt
              Write-Warning "Dispatch attempt $attempt failed. Retrying in $delay seconds."
              Start-Sleep -Seconds $delay
            }
          }

          if (-not $dispatched) {
            throw "Could not queue the next draft check after five attempts. The watchdog will restart the chain."
          }

name: Temporary Keeper Openings Summary

on:
  push:
    branches:
      - tmp/sleeper-check-1314734374628884480

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build keeper openings summary
        run: |
          cat > /tmp/keeper-summary.mjs <<'EOF'
          import fs from 'node:fs';

          const base = 'https://api.sleeper.app/v1';
          const leagueId = '1314734374628884480';
          const get = async (path) => {
            const response = await fetch(`${base}${path}`);
            if (!response.ok) throw new Error(`${path}: ${response.status}`);
            return response.json();
          };

          const league = await get(`/league/${leagueId}`);
          const rosters = await get(`/league/${leagueId}/rosters`);
          const players = await get('/players/nfl');
          const previousLeagueId = league.previous_league_id;
          const previousDrafts = previousLeagueId ? await get(`/league/${previousLeagueId}/drafts`) : [];
          const previousDraft = [...previousDrafts].sort((a, b) => Number(b.created || 0) - Number(a.created || 0))[0] || null;
          const previousPicks = previousDraft ? await get(`/draft/${previousDraft.draft_id}/picks`) : [];

          const picksByPlayer = new Map();
          for (const pick of previousPicks) {
            if (pick.player_id) picksByPlayer.set(String(pick.player_id), pick);
          }

          const fullName = (id) => {
            const p = players[String(id)];
            if (!p) return String(id);
            return p.full_name || `${p.first_name || ''} ${p.last_name || ''}`.trim() || String(id);
          };

          const vacant = rosters
            .filter((roster) => !roster.owner_id)
            .map((roster) => ({
              roster_id: roster.roster_id,
              waiver_position: roster.settings?.waiver_position ?? null,
              existing_keeper_ids: roster.keepers || [],
              players: (roster.players || []).map((id) => {
                const pick = picksByPlayer.get(String(id));
                const round = pick?.round ?? null;
                return {
                  player_id: String(id),
                  name: fullName(id),
                  position: players[String(id)]?.position || (String(id).length <= 3 ? 'DEF' : null),
                  current_team: players[String(id)]?.team || (String(id).length <= 3 ? String(id) : null),
                  drafted_round_2025: round,
                  was_keeper_2025: Boolean(pick?.is_keeper),
                  drafted_by_roster_2025: pick?.roster_id ?? null,
                  eligible_under_round_3_rule: Number.isInteger(round) && round >= 3,
                  keeper_cost_2026: Number.isInteger(round) && round >= 3 ? round - 2 : null,
                  sleeper_note: roster.metadata?.[`p_nick_${id}`] || null
                };
              })
            }));

          const result = {
            checked_at_utc: new Date().toISOString(),
            league: {
              league_id: league.league_id,
              name: league.name,
              season: league.season,
              previous_league_id: previousLeagueId,
              max_keepers: league.settings?.max_keepers,
              draft_rounds: league.settings?.draft_rounds,
              total_rosters: league.total_rosters
            },
            previous_draft: previousDraft ? {
              draft_id: previousDraft.draft_id,
              season: previousDraft.season,
              rounds: previousDraft.settings?.rounds,
              status: previousDraft.status
            } : null,
            assigned_count: rosters.filter((r) => r.owner_id).length,
            vacant_count: vacant.length,
            vacant_rosters: vacant
          };

          fs.mkdirSync('data', { recursive: true });
          fs.writeFileSync('data/keeper-openings-summary.json', JSON.stringify(result, null, 2));
          EOF
          node /tmp/keeper-summary.mjs

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/keeper-openings-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Record keeper openings summary"
            git pull --rebase origin tmp/sleeper-check-1314734374628884480
            git push origin HEAD:tmp/sleeper-check-1314734374628884480
          fi

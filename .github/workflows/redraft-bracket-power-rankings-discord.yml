name: Redraft Bracket Discord Power Rankings

on:
  schedule:
    - cron: "30 1 * * 2"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Refresh and preview the combined Top 20 without posting or committing."
        required: false
        type: boolean
        default: true
      force_refresh:
        description: "Rewrite the persistent Discord card even when this snapshot is already current."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: redraft-bracket-discord-power-rankings
  cancel-in-progress: false

jobs:
  power-rankings:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DISCORD_REDRAFT_BRACKET_POWER_RANKINGS_ENABLED == 'true' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build a fresh Redraft Bracket ranking snapshot from Sleeper
        shell: pwsh
        run: |
          $outputPath = Join-Path $env:RUNNER_TEMP "redraft-bracket-power-rankings.json"
          & .\scripts\sync-power-rankings.ps1 `
            -LeagueRecordIds @("RDB1", "RDB2", "RDB3", "RDB4", "RDB5") `
            -OutputPath $outputPath `
            -PublishDrafting

      - name: Update the persistent Discord power rankings
        id: publish
        shell: pwsh
        env:
          DISCORD_WEBHOOK_REDRAFT_BRACKET_POWER_RANKINGS: ${{ secrets.DISCORD_WEBHOOK_REDRAFT_BRACKET_POWER_RANKINGS }}
        run: |
          $args = @(
            "-NoProfile", "-ExecutionPolicy", "Bypass",
            "-File", ".\scripts\post-discord-redraft-bracket-power-rankings.ps1",
            "-RankingsPath", (Join-Path $env:RUNNER_TEMP "redraft-bracket-power-rankings.json")
          )
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.dry_run }}" -eq "true") {
            $args += "-DryRun"
          }
          if ("${{ inputs.force_refresh }}" -eq "true") {
            $args += "-ForceRefresh"
          }
          powershell @args

      - name: Save the Discord message state
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) }}
        shell: pwsh
        run: |
          $statePath = "data/discord-redraft-bracket-power-rankings-state.json"
          if (Test-Path -LiteralPath $statePath) {
            git add -- $statePath
          }
          if (git diff --cached --quiet) {
            Write-Host "Discord power-ranking message state is already current."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Redraft Bracket Discord power rankings"

          $pushed = $false
          foreach ($attempt in 1..4) {
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { throw "Could not rebase the power-ranking update onto origin/main." }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              $pushed = $true
              break
            }
            if ($attempt -lt 4) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not $pushed) { throw "Could not push the power-ranking state after four attempts." }

name: Temporary Sleeper Check

on:
  push:
    branches:
      - tmp/sleeper-check-1314734374628884480

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Sleeper player IDs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $players = Invoke-RestMethod -Uri 'https://api.sleeper.app/v1/players/nfl'
          $ids = @(
            '11566','12508','2449','4035','5001','5892','5927','6803','7569','7611','8130','8183','9509',
            '10232','11579','11631','12476','12526','3214','4892','5045','5850','7090','7523','8167',
            '10222','11584','11597','12472','12490','12493','12529','12547','421','6790','8137','8800','9480','9487'
          )
          $result = [ordered]@{}
          foreach ($id in $ids) {
            $prop = $players.PSObject.Properties[$id]
            if ($null -eq $prop) {
              $result[$id] = $null
              continue
            }
            $p = $prop.Value
            $result[$id] = [ordered]@{
              full_name = [string]$p.full_name
              first_name = [string]$p.first_name
              last_name = [string]$p.last_name
              position = [string]$p.position
              team = [string]$p.team
              status = [string]$p.status
              years_exp = $p.years_exp
            }
          }
          $result | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath data/sleeper-player-map.json

      - name: Commit result
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sleeper-player-map.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "Resolve Sleeper player IDs"
            git pull --rebase origin tmp/sleeper-check-1314734374628884480
            git push origin HEAD:tmp/sleeper-check-1314734374628884480
          }
